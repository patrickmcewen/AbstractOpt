# StepDB/bench_config.yaml
# Central configuration for all StepDB kernel pairs.
# Single source of truth for dimensions and tiling parameters.

gemm_tile_mk:
  problem: kernels/gemm_tile_mk/reference.py
  step_impl: kernels/gemm_tile_mk/step_impl.py
  params: [M, K, N, tile_m, tile_k]
  presets:
    small:       {M: 32,   K: 48,   N: 64,   tile_m: 16, tile_k: 16}
    square:      {M: 64,   K: 64,   N: 64,   tile_m: 16, tile_k: 16}
    wide:        {M: 32,   K: 128,  N: 256,  tile_m: 16, tile_k: 16}
    tall:        {M: 128,  K: 48,   N: 64,   tile_m: 16, tile_k: 16}
    large_tile:  {M: 64,   K: 64,   N: 128,  tile_m: 32, tile_k: 32}

