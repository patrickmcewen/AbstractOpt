# configs/experiment_full.yaml
# Full benchmark suite — use after the basic experiment succeeds.

llm_config: configs/llm.json

kernels:
  - name: gemm
    problem: StepBench/problems/gemm.py
    preset: small
  - name: gemm_batched
    problem: StepBench/problems/gemm_batched.py
    preset: small
  - name: activation
    problem: StepBench/problems/activation.py
    preset: swish_small
  - name: activation_swish
    problem: StepBench/problems/activation.py
    preset: swish_small
  - name: layernorm
    problem: StepBench/problems/layernorm.py
    preset: small
  - name: rmsnorm
    problem: StepBench/problems/rmsnorm.py
    preset: small
  - name: gemm_swish_scaling
    problem: StepBench/problems/gemm_swish_scaling.py
    preset: small
  - name: gemm_scale_residual
    problem: StepBench/problems/gemm_scale_residual.py
    preset: small
  - name: sdpa
    problem: StepBench/problems/sdpa.py
    preset: small
  - name: mlp
    problem: StepBench/problems/mlp.py
    preset: small

iterations: 5
plans_per_kernel: 4
implementations_per_plan: 2
top_k: 3
