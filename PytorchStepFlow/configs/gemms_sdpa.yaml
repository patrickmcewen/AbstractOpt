# configs/experiment.yaml
# Which kernels to optimize and loop parameters.

llm_config: configs/llm.json

kernels:
  - name: gemm
    problem: StepBench/problems/gemm.py
    preset: small
  - name: gemm_batched
    problem: StepBench/problems/gemm_batched.py
    preset: small
  - name: sdpa
    problem: StepBench/problems/sdpa.py
    preset: small

iterations: 4
plans_per_kernel: 4
implementations_per_plan: 2
top_k: 3
